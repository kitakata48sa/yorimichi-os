<style>

*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f6f2e8,#eaf0e7);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.55}.app{max-width:1050px;margin:auto;padding:14px}.hero{padding:26px 4px 18px;display:flex;justify-content:space-between;gap:14px;align-items:end}.hero h1{font-size:clamp(36px,7vw,68px);line-height:.95;letter-spacing:-.05em;margin:4px 0}.hero p{color:var(--muted);max-width:650px}.badge{background:var(--ink);color:white;padding:8px 12px;border-radius:99px;font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:rgba(255,253,247,.96);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 10px 30px #23302712}.card h2{margin:0 0 13px;font-size:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:10px}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbc6ba;border-radius:10px;background:white;font:inherit}textarea{min-height:100px}.actions,.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}button{border:0;border-radius:10px;padding:10px 12px;background:var(--ink);color:white;font:inherit;font-weight:800;cursor:pointer}button.secondary{background:#e7e2d8;color:var(--ink)}button.green{background:var(--green)}button.accent{background:var(--accent)}button.ghost{background:white;color:var(--ink);border:1px solid var(--line)}button.danger{background:#7b2c25}.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:6px 9px}.chip input{width:auto}.small{font-size:12px;color:var(--muted)}.status{padding:10px;border-radius:10px;background:#ecf3ec;font-size:12px;margin:9px 0}.warn{background:#fff0e4;color:var(--warn)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:22px}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:13px}.tab{background:#e7e2d8;color:var(--ink);white-space:nowrap}.tab.active{background:var(--ink);color:white}.result{border:1px solid var(--line);border-radius:13px;background:white;padding:13px;margin:9px 0}.top{display:flex;justify-content:space-between;gap:10px}.score{color:var(--accent);font-size:21px;font-weight:900}.tag{display:inline-block;padding:3px 6px;margin:4px 3px 0 0;background:#edf0e9;border-radius:6px;font-size:11px}.listrow{border-bottom:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:10px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:end;justify-content:center;padding:12px;z-index:1000}.sheet{background:var(--panel);width:min(700px,100%);border-radius:18px;padding:18px;max-height:90vh;overflow:auto}.close{float:right}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:white;padding:9px 13px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:2000}.toast.show{opacity:1}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin-top:10px}.eventbox{margin:11px 0;padding:11px;border-radius:11px;background:#fff3e8;border:1px solid #f0c9ae}.sourcebox{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.sourceitem{margin:7px 0;padding:8px;background:#f3f5f0;border-radius:9px}.sourceitem a{color:var(--green);font-weight:800}.discovery{margin:12px 0 0;padding:10px;border-radius:10px;background:#eef4ff;border:1px solid #cad9ef}.signal{display:flex;justify-content:space-between;gap:8px;margin:4px 0;font-size:12px}.signal b{color:#244f82}.summaryline{font-weight:700;margin:9px 0}.details{margin-top:10px}.details summary{cursor:pointer;font-weight:800;color:var(--green);padding:8px 0}.role{font-size:11px;padding:4px 7px;border-radius:99px;background:#17201b;color:white}.linkbtn{display:inline-block;text-decoration:none}.decisionbar{padding-top:10px;border-top:1px solid var(--line);margin-top:10px}.reasonOptions{display:grid;grid-template-columns:1fr;gap:7px;margin:12px 0}.reasonOption{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;background:white}.reasonOption input{width:auto;margin:0}.modalActions{display:flex;gap:8px;flex-wrap:wrap}.activeDecision{outline:3px solid #f0b38f}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.hero{display:block}.badge{display:inline-block}}
</style>

<body>
<div class="app">
<header class="hero"><div><div class="small">REAL-TIME DETOUR DECISION KIT</div><h1>よりみちOS</h1><p>外部記憶を読み、推薦への反応を場所台帳へ戻す循環型プロトタイプ。</p></div><div class="badge">v0.6.2-dev</div></header>
<section class="card"><h2>外部記憶</h2><div class="stats"><div class="stat"><b id="allN">-</b>場所</div><div class="stat"><b id="wantN">-</b>行ってみたい</div><div class="stat"><b id="reN">-</b>再訪候補</div><div class="stat"><b id="srcN">-</b>情報源</div></div><div id="memoryStatus" class="status">読み込み中…</div><div class="actions"><button class="secondary" id="reloadMemory">再読込</button><button class="ghost" id="exportLedger">場所台帳を書き出す</button><button class="ghost" id="exportChanges">更新パケットを書き出す</button><button class="ghost" id="importChangesBtn">更新パケットを読み込む</button><input id="importChanges" type="file" accept="application/json,.json" class="hidden"><button class="secondary" id="markSynced">現在の変更を同期済みにする</button><button class="ghost" id="exportBackup">完全バックアップ</button><button class="ghost" id="importBackupBtn">バックアップ復元</button><input id="importBackup" type="file" accept="application/json,.json" class="hidden"></div></section>
<div class="grid">
<section class="card"><h2>1. いまの状況</h2><div class="row"><div class="field"><label>現在地</label><input id="currentPlace" placeholder="駅名・施設名"><button class="secondary" id="geoBtn" style="margin-top:6px">現在地を取得</button></div><div class="field"><label>現在時刻</label><input id="now" type="datetime-local"></div></div><div class="row"><div class="field"><label>次の目的地</label><input id="nextPlace" placeholder="なし"></div><div class="field"><label>到着期限</label><input id="deadline" type="datetime-local"></div></div><div class="row"><div class="field"><label>移動手段</label><select id="mode"><option>徒歩＋公共交通</option><option>徒歩のみ</option><option>自転車</option><option>車・タクシー</option></select></div><div class="field"><label>安全余裕</label><select id="buffer"><option value="10">10分</option><option value="15" selected>15分</option><option value="20">20分</option></select></div></div><div class="field"><label>気分・制約</label><textarea id="mood"></textarea></div><div class="chips"><label class="chip"><input type="checkbox" value="未知優先" checked>未知</label><label class="chip"><input type="checkbox" value="イベント優先" checked>イベント</label><label class="chip"><input type="checkbox" value="建築・運営" checked>建築・運営</label><label class="chip"><input type="checkbox" value="本・植物・音">本・植物・音</label></div><div class="actions"><button class="accent" id="makePrompt">調査依頼を作る</button></div></section>
<section class="card"><h2>2. M365 Copilotへ渡す</h2><textarea id="promptOut" style="min-height:350px"></textarea><div class="actions"><button class="green" id="copyPrompt">コピー</button></div><p class="small">現在地付近の行ってみたい・再訪候補と、外部記憶URLを含めます。</p></section>
</div>
<section class="card"><div class="tabs"><button class="tab active" data-tab="results">結果</button><button class="tab" data-tab="ledger">場所台帳</button><button class="tab" data-tab="history">履歴</button><button class="tab" data-tab="sources">情報源</button><button class="tab" data-tab="prefs">好み</button></div>
<div id="resultsTab"><textarea id="responseIn" placeholder="CopilotのJSON回答を貼る"></textarea><div class="actions"><button id="parseBtn">候補を読み込む</button></div><div id="parseStatus"></div><div id="resultList"></div></div>
<div id="ledgerTab" class="hidden"><div class="row"><input id="ledgerSearch" placeholder="場所名を検索"><select id="ledgerFilter"><option value="">すべて</option><option value="want_to_visit">行ってみたい</option><option value="visited_want_to_revisit">また行きたい</option><option value="visited">訪問済み</option><option value="suppressed">今後は勧めない</option></select></div><div id="ledgerList"></div></div>
<div id="historyTab" class="hidden"><div id="historyList"></div></div><div id="sourcesTab" class="hidden"><div class="row"><input id="sourceSearch" placeholder="情報源名・URLを検索"><select id="sourceFilter"><option value="">すべて</option><option value="positive">肯定的</option><option value="negative">否定的</option><option value="unused">未評価</option></select></div><div id="sourceSummary" class="status"></div><div id="sourceList"></div></div><div id="prefsTab" class="hidden"><textarea id="prefsText"></textarea></div></section>
</div>
<div id="reviewModal" class="modal hidden" role="dialog" aria-modal="true"><div class="sheet"><button class="ghost close" id="closeModal">閉じる</button><h2 id="reviewTitle">訪問レビュー</h2><div class="field"><label>予想との差</label><select id="expectation"><option>期待以上</option><option selected>ほぼ予想通り</option><option>期待以下</option></select></div><div class="field"><label>再訪意向</label><select id="revisit"><option>強くまた行きたい</option><option selected>条件次第</option><option>一度で十分</option></select></div><div class="field"><label>良かった要素</label><div class="chips" id="goodTags"></div></div><div class="field"><label>再訪条件・メモ</label><textarea id="reviewNote"></textarea></div><button class="green" id="saveReview">レビューを保存</button></div></div>
<div id="decisionModal" class="modal hidden" role="dialog" aria-modal="true"><div class="sheet"><button class="ghost close" id="closeDecision">閉じる</button><h2 id="decisionTitle">理由を教えてください</h2><p id="decisionHelp" class="small"></p><div id="reasonOptions" class="reasonOptions"></div><div class="field"><label>補足メモ（任意）</label><textarea id="decisionNote" placeholder="条件や理由を短く記録"></textarea></div><div class="modalActions"><button id="saveDecision">保存</button><button class="ghost" id="cancelDecision">キャンセル</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const KEY='yorimichi_os_v02';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{ledger:[],history:[],changes:[],prefs:null,cache:{}};
state.ledger=state.ledger||[];state.history=state.history||[];state.changes=state.changes||[];state.cache=state.cache||{};state.sourceSignals=state.sourceSignals||[];state.decisionReasons=state.decisionReasons||[];state.syncedChanges=state.syncedChanges||[];state.importedPacketIds=state.importedPacketIds||[];
let candidates=[],coords=null,reviewIndex=null,pendingDecision=null;
const DATA=['places.json','watch-sources.json','preference-profile.json','instagram-curated-sources-v0.9.1.json'];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}
function dt(d=new Date()){let z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
$('#now').value=dt();$('#deadline').value=dt(new Date(Date.now()+2*3600e3));
function key(p){return p.google_place_id||p.google_maps_place_url||p.google_maps_url||((p.name||'')+'|'+(p.address||'')).toLowerCase()}
function mergeLedger(items){let m=new Map(state.ledger.map(x=>[key(x),x]));items.forEach(x=>{let k=key(x);m.set(k,{...x,...(m.get(k)||{})})});state.ledger=[...m.values()];save()}
async function loadMemory(){let ok=[];for(const f of DATA){try{let r=await fetch(f+'?v='+Date.now());if(!r.ok)throw Error(String(r.status));let x=await r.json();state.cache[f]=x;ok.push(f)}catch(e){if(state.cache[f])ok.push(f+'（キャッシュ）')}}let p=state.cache['places.json'];if(p?.places)mergeLedger(p.places);state.prefs=state.cache['preference-profile.json']||state.prefs;save();renderMemory(ok);renderLedger()}
function renderMemory(ok){let s=state.cache['watch-sources.json']?.meta?.counts||{},cur=state.cache['instagram-curated-sources-v0.9.1.json'];$('#allN').textContent=state.ledger.length;$('#wantN').textContent=state.ledger.filter(x=>x.relationship==='want_to_visit').length;$('#reN').textContent=state.ledger.filter(x=>x.relationship==='visited_want_to_revisit').length;$('#srcN').textContent=(s.instagram_following||0)+(s.learned_web_sources||0);let tc=cur?.tier_counts?`｜監査済み ${cur.total}件（A ${cur.tier_counts.A||0} / B ${cur.tier_counts.B||0} / C ${cur.tier_counts.C||0}）`:'';$('#memoryStatus').textContent=`${ok.length}/4データ読込${tc}｜未同期 ${state.changes.length}件｜同期済み ${state.syncedChanges.length}件｜最終確認 ${new Date().toLocaleString()}`}
$('#reloadMemory').onclick=loadMemory;
$('#geoBtn').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{coords={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),accuracy_m:Math.round(p.coords.accuracy)};$('#currentPlace').value=`現在地 (${coords.lat}, ${coords.lng})`;toast('現在地を取得しました')},e=>toast(e.code===1?'位置情報が拒否されています':'位置情報を取得できません'),{enableHighAccuracy:true,timeout:15000,maximumAge:30000}):toast('位置情報非対応');
function sit(){return{current_place:$('#currentPlace').value,coordinates:coords,now:$('#now').value,next_destination:$('#nextPlace').value,arrival_deadline:$('#deadline').value,travel_mode:$('#mode').value,buffer_minutes:+$('#buffer').value,mood:$('#mood').value,search_modes:$$('.chip input:checked').map(x=>x.value)}}
function shortlist(){return state.ledger.filter(x=>['want_to_visit','visited_want_to_revisit'].includes(x.relationship)).slice(0,80).map(x=>({name:x.name,state:x.relationship,map:x.google_maps_url||x.google_maps_place_url||''}))}
function sourceScenario(s){let q=[...(s.search_modes||[]),s.mood||''].join(' ');if(/植物|園芸|ビカクシダ|アクア/.test(q))return 'plants';if(/自転車|輪行|グラベル|bike/i.test(q)||String(s.travel_mode).includes('自転車'))return 'bicycle';if(/研究|設計|建築|素材|製造|3D|Grasshopper|家具/.test(q))return 'research_design';if(/旅行|遠出/.test(q))return 'travel';return 'outing'}
function discoveryEnabled(s){return /未知|意外|発見|セレンディピティ/.test([...(s.search_modes||[]),s.mood||''].join(' '))}
function tieredInstagramSources(s){let accounts=state.cache['instagram-curated-sources-v0.9.1.json']?.accounts||[],scenario=sourceScenario(s),allowC=discoveryEnabled(s),limits={A:30,B:10,C:5},rank={A:0,B:1,C:2};let tier=x=>x.scenario_tiers?.[scenario]||x.scenario_tiers?.['休日・外出']||x.recommended_tier||'C',score=x=>Number(x.interest_signal_score||0);return accounts.filter(x=>{let v=tier(x);return v==='A'||v==='B'||(allowC&&v==='C')}).sort((a,b)=>rank[tier(a)]-rank[tier(b)]||score(b)-score(a)||String(a.handle).localeCompare(String(b.handle))).filter((x,i,all)=>all.slice(0,i).filter(y=>tier(y)===tier(x)).length<limits[tier(x)]).map(x=>({handle:x.handle,profile_url:x.profile_url||`https://www.instagram.com/_u/${x.handle}`,tier:tier(x),tier_reason:x.tier_reason,category:x.category,scope:x.scope,geographic_scope:x.geographic_scope,target_type:x.target_type,resolution_stage:x.resolution_stage,interest_signal_score:x.interest_signal_score}))}

$('#makePrompt').onclick=()=>{let base=location.origin+location.pathname.replace(/[^/]*$/,''),situation=sit(),instagram=tieredInstagramSources(situation),tierCounts={A:instagram.filter(x=>x.tier==='A').length,B:instagram.filter(x=>x.tier==='B').length,C:instagram.filter(x=>x.tier==='C').length};let payload={situation,continuous_data:{places:base+'places.json',sources:base+'watch-sources.json',preferences:base+'preference-profile.json',instagram_curated:base+'instagram-curated-sources-v0.9.1.json'},priority_candidates:shortlist(),suppressed:state.ledger.filter(x=>x.relationship==='suppressed').map(x=>x.name),preferred_sources:sourceScores().filter(x=>x.score>0).slice(0,20).map(x=>({label:x.label,url:x.url,score:x.score,events:x.events})),instagram_interest_sources:instagram,instagram_runtime:{dataset_version:'0.9.1',audited_total:state.cache['instagram-curated-sources-v0.9.1.json']?.total||0,scenario:sourceScenario(situation),selected_tier_counts:tierCounts,rules:['Tier Aを優先','Tier Bは候補不足または相談テーマ適合時','Tier Cは未知探索時のみ','国内の店舗・施設・イベントを優先','海外一般情報源・一般店舗・汎用Tipsを抑制','海外著名デザイナー・固有技術は研究文脈で維持','店舗・イベントは公式情報と別系統情報で現在性を確認']}};$('#promptOut').value=`あなたは私専用のリアルタイム都市探索リサーチャーです。現在地・時間・次の予定を厳守し、公式情報と別系統情報で営業と当日イベントを確認してください。人気順ではなく、建築履歴、読み替え、更新可能性、複合用途、半公共性、制作・物流の可視化、非飲酒参加性で評価してください。Instagram情報源は監査済みv0.9.1を使い、Tier Aを優先、Tier Bは条件付き、Tier Cは未知探索時だけ使ってください。Tier Aでも営業中・開催中を意味しないため、店舗・イベントは必ず現在性を再確認してください。\n\n${JSON.stringify(payload,null,2)}\n\n3〜7件に絞ってください。JSONのルートは必ずオブジェクトとし、候補一覧はcandidates配列へ格納してください。形式は {"generated_at":"ISO8601","research_summary":"短い総括","candidates":[],"rejected":[]} としてください。各候補に name,category,address,google_place_id,google_maps_place_url,official_url,arrival_time,depart_by,travel_minutes_from_current,travel_minutes_to_next,stay_minutes,open_at_arrival,event_today,why_fit,design_operations,non_alcohol,smoking,cost,operating_status,sources,confidence,taste_score,today_value_score,risk_notes,source_handles を含めてください。Instagram由来の場合はsource_handlesへハンドルを入れ、sourcesへTierとtier_reasonを残してください。イベント候補にはeventオブジェクトを追加し、is_event,start_at,end_at,last_entry_at,admission,reservation,venue_name,official_event_url,organizer_name,organizer_url,official_instagram_url,same_day_update_url,urgencyを可能な範囲で入れてください。sourcesの各要素にはtype,label,url,note,verified_itemsを含めてください。さらにdiscovery_sources配列へinstagram_interest,instagram_saved,google_maps_memory,live_event_search,preference_profileの寄与をcontributionとexplanation付きで記録し、serendipity_score（0〜100）、known_to_user、role（今日の発見、嗜好ど真ん中、近場の確実案、長居候補）を入れてください。イベント候補ではevent_entitiesオブジェクトも追加し、venue、organizer、exhibitors、themesを可能な範囲で構造化してください。確認できない人物・団体・出展者は推測せず空配列にしてください。説明文はJSONの外へ出さないでください。`;toast(`調査依頼を作りました（Instagram ${instagram.length}件：A${tierCounts.A}/B${tierCounts.B}/C${tierCounts.C}）`)};
$('#copyPrompt').onclick=async()=>{let t=$('#promptOut').value;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(t);else{$('#promptOut').select();document.execCommand('copy')}toast('コピーしました')}catch(e){toast('コピーできません。テキストを長押ししてください')}};
function parseJsonResponse(input){let text=String(input||'').trim();if(!text)throw Error('入力欄が空です');text=text.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/i,'').trim();try{return JSON.parse(text)}catch(first){let os=text.indexOf('{'),as=text.indexOf('['),starts=[os,as].filter(n=>n>=0),oe=text.lastIndexOf('}'),ae=text.lastIndexOf(']'),ends=[oe,ae].filter(n=>n>=0);if(!starts.length||!ends.length)throw Error('JSONの開始位置または終了位置を特定できません');let start=Math.min(...starts),end=Math.max(...ends);try{return JSON.parse(text.slice(start,end+1))}catch(second){throw Error('JSONの構文が正しくありません: '+second.message)}}}
function candidateArray(parsed){if(Array.isArray(parsed))return parsed;if(parsed&&Array.isArray(parsed.candidates))return parsed.candidates;if(parsed&&Array.isArray(parsed.results))return parsed.results;if(parsed?.result&&Array.isArray(parsed.result.candidates))return parsed.result.candidates;throw Error('候補配列が見つかりません。candidates配列または配列形式で返してください')}
function asArray(v){if(Array.isArray(v))return v;if(v===null||v===undefined||v==='')return [];return [String(v)]}function asText(v,sep='。'){return asArray(v).join(sep)}function score(c){return Math.round((+c.taste_score||0)*.5+(+c.today_value_score||0)*.3+(+c.confidence||0)*20)}
function mapUrl(c){if(c.google_maps_place_url)return c.google_maps_place_url;let q=[c.name,c.address].filter(Boolean).join(' ');if(c.google_place_id&&q)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)+'&query_place_id='+encodeURIComponent(c.google_place_id);return q?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q):(c.map_url||'')}
$('#parseBtn').onclick=()=>{try{let parsed=parseJsonResponse($('#responseIn').value);candidates=candidateArray(parsed).filter(x=>x&&typeof x==='object');candidates.sort((a,b)=>score(b)-score(a));renderResults();$('#parseStatus').innerHTML=`<div class="status">${candidates.length}件の候補を読み込みました。</div>`;toast(`${candidates.length}件読み込みました`)}catch(e){candidates=[];$('#resultList').innerHTML='';$('#parseStatus').innerHTML=`<div class="status warn"><b>JSON読込エラー</b><br>${esc(e.message)}</div>`;toast('JSON読込エラー')}};
function validUrl(v){return typeof v==='string'&&/^https?:\/\//i.test(v)}
function uniqueLinks(items){let seen=new Set();return items.filter(x=>{if(!validUrl(x.url)||seen.has(x.url))return false;seen.add(x.url);return true})}
function sourceLabel(src){let t=String(src.type||'').toLowerCase();if(src.label)return src.label;if(t.includes('official_instagram'))return '公式Instagram';if(t.includes('same_day'))return '当日更新';if(t.includes('organizer'))return '主催者情報';if(t.includes('official'))return '公式情報';if(t.includes('local_media'))return '地域メディア';if(t.includes('independent'))return '補助情報源';return '情報源'}
function eventInfo(c){let e=c.event&&typeof c.event==='object'?c.event:{};let text=[c.category,c.event_today,c.name].filter(Boolean).join(' ');return {...e,is_event:Boolean(e.is_event)||/(イベント|展示|展覧会|企画展|ポップアップ|ワークショップ|開催|会期|出展)/.test(text)}}
function eventLinks(c){let e=eventInfo(c),srcs=Array.isArray(c.sources)?c.sources:[],links=[];if(validUrl(e.official_event_url))links.push({label:'公式イベント詳細',url:e.official_event_url,note:'公式イベントページ'});if(validUrl(c.official_url))links.push({label:e.is_event?'公式イベント詳細':'公式サイト',url:c.official_url,note:'公式情報'});if(validUrl(e.organizer_url))links.push({label:e.organizer_name?`主催者: ${e.organizer_name}`:'主催者情報',url:e.organizer_url,note:'主催者の公式情報'});if(validUrl(e.official_instagram_url))links.push({label:'公式Instagram',url:e.official_instagram_url,note:'最新投稿・当日情報'});if(validUrl(e.same_day_update_url))links.push({label:'当日更新',url:e.same_day_update_url,note:'変更・混雑・開催状況'});srcs.forEach(src=>links.push({label:sourceLabel(src),url:src.url,note:src.note||asText(src.verified_items,'、')}));return uniqueLinks(links)}
function formatWhen(v){if(!v)return '';let d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function eventBlock(c){let e=eventInfo(c);if(!e.is_event&&!c.event_today)return '';let bits=[];if(e.start_at||e.end_at)bits.push(`${formatWhen(e.start_at)||'開始不明'}〜${formatWhen(e.end_at)||'終了不明'}`);if(e.admission)bits.push(`料金: ${e.admission}`);if(e.reservation)bits.push(`予約: ${e.reservation}`);if(e.last_entry_at)bits.push(`最終入場: ${formatWhen(e.last_entry_at)}`);if(e.urgency)bits.push(`緊急度: ${e.urgency}`);return `<div class="eventbox"><b>今日・イベント情報</b>${bits.length?`<div class="small">${esc(bits.join(' ｜ '))}</div>`:''}${c.event_today?`<div>${esc(asText(c.event_today))}</div>`:''}</div>`}
function sourceBlock(c){let links=eventLinks(c);if(!links.length)return '';return `<div class="sourcebox"><b>詳細・情報源</b>${links.map(x=>`<div class="sourceitem"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)} ↗</a>${x.note?`<div class="small">確認内容: ${esc(asText(x.note,'、'))}</div>`:''}</div>`).join('')}</div>`}
function discoveryItems(c){if(Array.isArray(c.discovery_sources)&&c.discovery_sources.length)return c.discovery_sources;let xs=[];if(eventInfo(c).is_event)xs.push({source_type:'live_event_search',contribution:'high',explanation:'当日イベント情報から発見'});if(c.known_to_user===false)xs.push({source_type:'serendipity',contribution:'high',explanation:'本人未把握の候補'});return xs}
function discoveryLabel(t){return({instagram_interest:'Instagram関心',instagram_saved:'Instagram保存投稿',google_maps_memory:'Googleマップ記憶',live_event_search:'当日イベント検索',preference_profile:'嗜好モデル',serendipity:'未知性'})[t]||t||'発見要因'}
function discoveryBlock(c){let xs=discoveryItems(c),ss=Number.isFinite(+c.serendipity_score)?+c.serendipity_score:null;if(!xs.length&&ss===null)return '';return `<div class="discovery"><b>発見経路${ss!==null?`｜セレンディピティ ${ss}`:''}</b>${xs.map(x=>`<div class="signal"><span>${esc(discoveryLabel(x.source_type))}: ${esc(x.explanation||x.source_name||'')}</span><b>${esc(x.contribution||'')}</b></div>`).join('')}</div>`}
function roleOf(c){if(c.role)return c.role;if(c.known_to_user===false&&eventInfo(c).is_event)return '今日の発見';if((+c.taste_score||0)>=95)return '嗜好ど真ん中';if((+c.travel_minutes_from_current||999)<=12)return '近場の確実案';if((+c.stay_minutes||0)>=90)return '長居候補';return ''}
function renderResults(){if(!candidates.length){$('#resultList').innerHTML='<div class="empty">JSONは読み込めましたが、候補は0件でした。</div>';return}$('#resultList').innerHTML=candidates.map((c,i)=>{let e=eventInfo(c),role=roleOf(c),links=eventLinks(c);return `<div class="result"><div class="top"><div>${role?`<span class="role">${esc(role)}</span>`:''}<div><b>${esc(c.name||'名称不明')}</b></div><div class="small">${esc(c.category||'')}｜${esc(c.address||'')}</div></div><div class="score">${score(c)}</div></div>${eventBlock(c)}<div class="summaryline">${esc(asText(c.why_fit))}</div><div class="actions">${mapUrl(c)?`<a class="linkbtn" href="${esc(mapUrl(c))}" target="_blank" rel="noopener"><button class="green">${e.is_event?'会場を地図で開く':'店舗情報'}</button></a>`:''}${links[0]?`<a class="linkbtn" href="${esc(links[0].url)}" target="_blank" rel="noopener"><button class="accent">${esc(links[0].label)}</button></a>`:''}</div><div class="actions decisionbar"><button data-act="want" data-i="${i}">行ってみたい</button><button class="secondary" data-act="visit" data-i="${i}">行った</button><button class="secondary" data-act="revisit" data-i="${i}">また行きたい</button><button class="ghost" data-act="skip" data-i="${i}">今回は見送り</button><button class="danger" data-act="suppress" data-i="${i}">今後は勧めない</button></div><details class="details"><summary>詳しく見る</summary>${asText(c.design_operations)?`<p class="small"><b>設計・運営:</b> ${esc(asText(c.design_operations,' / '))}</p>`:''}<span class="tag">滞在 ${esc(c.stay_minutes??'?')}分</span><span class="tag">${esc(c.operating_status||'不明')}</span>${asText(c.risk_notes)?`<p class="small warn"><b>注意:</b> ${esc(asText(c.risk_notes,' / '))}</p>`:''}${sourceBlock(c)}${discoveryBlock(c)}</details></div>`}).join('');$$('[data-act]').forEach(b=>b.onclick=()=>act(+b.dataset.i,b.dataset.act))}
function rememberEventSources(c,signal){if(!eventInfo(c).is_event)return;state.sourceSignals=state.sourceSignals||[];eventLinks(c).forEach(x=>state.sourceSignals.push({url:x.url,label:x.label,event_name:c.name,signal,at:new Date().toISOString()}));save()}
function upsert(c,relationship,extra={}){let k=key(c),i=state.ledger.findIndex(x=>key(x)===k),p={...(i>=0?state.ledger[i]:{}),name:c.name,address:c.address||'',category:c.category||'',google_place_id:c.google_place_id||null,google_maps_place_url:c.google_maps_place_url||mapUrl(c),relationship,event:c.event||null,discovery_sources:c.discovery_sources||[],serendipity_score:Number.isFinite(+c.serendipity_score)?+c.serendipity_score:null,known_to_user:c.known_to_user,role:c.role||'',recommendation_snapshot:{taste_score:+c.taste_score||0,today_value_score:+c.today_value_score||0,confidence:+c.confidence||0,predicted_at:new Date().toISOString()},last_interaction_at:new Date().toISOString(),...extra};if(i>=0)state.ledger[i]=p;else state.ledger.push(p);state.changes.push({action:i>=0?'update':'add',at:new Date().toISOString(),place:p});state.history.push({name:c.name,action:relationship,at:new Date().toISOString()});save();renderMemory(DATA);renderLedger()}
const SKIP_REASONS=['時間が足りない','遠い','終了が近い','今日は気分が違う','同行者がいる日に行きたい','予算が合わない','場所自体には興味がある','その他'];
const SUPPRESS_REASONS=['内容に興味がない','既知すぎる','買い物圧が強そう','混雑・観光地化が気になる','空間はよいが運営に関心がない','営業情報の信頼性が低い','その他'];
function openDecision(i,type){pendingDecision={i,type};let c=candidates[i],skip=type==='skip',opts=skip?SKIP_REASONS:SUPPRESS_REASONS;$('#decisionTitle').textContent=(skip?'今回は見送る理由':'今後は勧めない理由')+'｜'+c.name;$('#decisionHelp').textContent=skip?'状況不一致として記録し、場所自体は減点しません。':'場所・内容への不一致として記録します。';$('#reasonOptions').innerHTML=opts.map((x,n)=>`<label class="reasonOption"><input type="checkbox" value="${esc(x)}">${esc(x)}</label>`).join('');$('#decisionNote').value='';$('#decisionModal').classList.remove('hidden')}
function closeDecision(){pendingDecision=null;$('#decisionModal').classList.add('hidden')}
$('#closeDecision').onclick=closeDecision;$('#cancelDecision').onclick=closeDecision;$('#decisionModal').onclick=e=>{if(e.target===$('#decisionModal'))closeDecision()};
$('#saveDecision').onclick=()=>{if(!pendingDecision)return;let {i,type}=pendingDecision,c=candidates[i],reasons=$$('#reasonOptions input:checked').map(x=>x.value),note=$('#decisionNote').value.trim();if(!reasons.length&&!note)return toast('理由を1つ以上選ぶか、メモを入力してください');let at=new Date().toISOString(),record={name:c.name,action:type==='skip'?'skipped_this_time':'suppressed',decision_reasons:reasons,free_note:note,at};state.decisionReasons.push(record);state.history.push(record);if(type==='skip'){state.changes.push({action:'interaction',at,name:c.name,state:'skipped_this_time',decision_reasons:reasons,free_note:note});save();closeDecision();renderHistory();toast('見送り理由を記録しました')}else{upsert(c,'suppressed',{recommendation_suppressed:true,decision_reasons:reasons,free_note:note});rememberEventSources(c,'negative');closeDecision();toast('非推薦理由を記録しました')}};
function act(i,a){let c=candidates[i];if(a==='want'){upsert(c,'want_to_visit',{visit_status:'not_visited'});rememberEventSources(c,'interested');toast('行ってみたいへ追加')}else if(a==='visit'){upsert(c,'visited',{visit_status:'visited'});rememberEventSources(c,'visited');openReview(i)}else if(a==='revisit'){upsert(c,'visited_want_to_revisit',{visit_status:'visited',revisit_interest:'high'});rememberEventSources(c,'revisit');toast('また行きたいへ追加')}else if(a==='skip'){openDecision(i,'skip')}else if(a==='suppress'){openDecision(i,'suppress')}}
const tags=['建築履歴','設計操作','本','植物','家具','音','飲食','ノンアル','人との距離','滞在性','制作・物流'];$('#goodTags').innerHTML=tags.map(t=>`<label class="chip"><input type="checkbox" value="${t}">${t}</label>`).join('');
function openReview(i){reviewIndex=i;$('#reviewTitle').textContent=(candidates[i].name||'場所')+' のレビュー';$('#reviewModal').classList.remove('hidden')}
function closeReview(){$('#reviewModal').classList.add('hidden');reviewIndex=null}
$('#closeModal').onclick=closeReview;$('#reviewModal').onclick=e=>{if(e.target===$('#reviewModal'))closeReview()};
$('#saveReview').onclick=()=>{if(reviewIndex===null)return closeReview();let c=candidates[reviewIndex],rev=$('#revisit').value,rel=rev==='強くまた行きたい'?'visited_want_to_revisit':'visited';upsert(c,rel,{visit_status:'visited',expectation:$('#expectation').value,revisit_intent:rev,positive_tags:$$('#goodTags input:checked').map(x=>x.value),review_note:$('#reviewNote').value,outcome_snapshot:{expectation:$('#expectation').value,revisit_intent:rev,positive_tags:$$('#goodTags input:checked').map(x=>x.value),reviewed_at:new Date().toISOString()},prediction_outcome_gap:{taste_score:+c.taste_score||0,today_value_score:+c.today_value_score||0,expectation:$('#expectation').value}});closeReview();toast('レビューを保存しました')};
function renderLedger(){let q=($('#ledgerSearch')?.value||'').toLowerCase(),f=$('#ledgerFilter')?.value||'',xs=state.ledger.filter(x=>(!q||(x.name||'').toLowerCase().includes(q))&&(!f||x.relationship===f)).slice(0,300);$('#ledgerList').innerHTML=`<p class="small">${xs.length}件表示（最大300件）</p>`+xs.map(x=>`<div class="listrow"><div><b>${esc(x.name)}</b><div class="small">${esc(x.category||'')}｜${esc(x.source_list||'よりみちOS')}</div></div><span class="tag">${esc(x.relationship||'')}</span></div>`).join('')}
$('#ledgerSearch').oninput=renderLedger;$('#ledgerFilter').onchange=renderLedger;
function renderHistory(){$('#historyList').innerHTML=[...state.history].reverse().slice(0,300).map(x=>`<div class="listrow"><div><b>${esc(x.name)}</b><div class="small">${new Date(x.at).toLocaleString()}</div></div><span class="tag">${esc(x.action)}</span></div>`).join('')||'<div class="empty">履歴はまだありません。</div>'}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['results','ledger','history','sources','prefs'].forEach(x=>$('#'+x+'Tab').classList.toggle('hidden',x!==b.dataset.tab));if(b.dataset.tab==='history')renderHistory();if(b.dataset.tab==='sources')renderSources();if(b.dataset.tab==='prefs')$('#prefsText').value=JSON.stringify(state.prefs,null,2)});
const SIGNAL_WEIGHTS={interested:1,visited:3,revisit:5,negative:-2,skipped_this_time:0};
function packetId(packet){return [packet.exported_at||'',(packet.changes||[]).length,(packet.source_signals||[]).length,JSON.stringify(packet).length].join('|')}
function importPacket(packet){if(!packet||typeof packet!=='object')throw Error('更新パケットの形式が不正です');let id=packetId(packet);if(state.importedPacketIds.includes(id))return {duplicate:true,places:0,signals:0,reasons:0};let pc=0,sc=0,rc=0;(packet.changes||[]).forEach(ch=>{if(ch.place){let before=state.ledger.length;mergeLedger([ch.place]);pc+=state.ledger.length>before?1:0}else if(ch.action==='interaction'){state.history.push({name:ch.name,action:ch.state||ch.action,decision_reasons:ch.decision_reasons||[],free_note:ch.free_note||'',at:ch.at||new Date().toISOString()})}});(packet.source_signals||[]).forEach(sig=>{let k=[sig.url,sig.event_name,sig.signal,sig.at].join('|');if(!state.sourceSignals.some(x=>[x.url,x.event_name,x.signal,x.at].join('|')===k)){state.sourceSignals.push(sig);sc++}});(packet.decision_reasons||[]).forEach(r=>{let k=[r.name,r.action,r.at].join('|');if(!state.decisionReasons.some(x=>[x.name,x.action,x.at].join('|')===k)){state.decisionReasons.push(r);rc++}});state.importedPacketIds.push(id);save();renderMemory(DATA);renderLedger();renderSources();return {duplicate:false,places:pc,signals:sc,reasons:rc}}
function sourceScores(){let m=new Map(),base=state.cache['watch-sources.json'];(base?.learned_sources||[]).forEach(x=>m.set(x.url,{url:x.url,label:x.label||x.url,score:+x.score||0,events:new Set((x.signals||[]).map(s=>s.event_name).filter(Boolean)),signals:[...(x.signals||[])]}));state.sourceSignals.forEach(sig=>{if(!sig.url)return;let x=m.get(sig.url)||{url:sig.url,label:sig.label||sig.url,score:0,events:new Set(),signals:[]};x.score+=SIGNAL_WEIGHTS[sig.signal]||0;if(sig.event_name)x.events.add(sig.event_name);x.signals.push(sig);m.set(sig.url,x)});return [...m.values()].map(x=>({...x,events:[...x.events]})).sort((a,b)=>b.score-a.score)}
function renderSources(){let q=($('#sourceSearch')?.value||'').toLowerCase(),f=$('#sourceFilter')?.value||'',all=sourceScores(),xs=all.filter(x=>(!q||(x.label+' '+x.url).toLowerCase().includes(q))&&(!f||(f==='positive'?x.score>0:f==='negative'?x.score<0:x.score===0)));$('#sourceSummary').textContent=`評価済みWeb情報源 ${all.length}件｜肯定 ${all.filter(x=>x.score>0).length}｜否定 ${all.filter(x=>x.score<0).length}`;$('#sourceList').innerHTML=xs.slice(0,200).map(x=>`<div class="listrow"><div><a href="${esc(x.url)}" target="_blank" rel="noopener"><b>${esc(x.label)}</b></a><div class="small">関連: ${esc(x.events.join('、')||'未分類')}｜シグナル ${x.signals.length}件</div></div><span class="tag">${x.score>0?'+':''}${x.score}</span></div>`).join('')||'<div class="empty">該当する情報源はありません。</div>'}
$('#importChangesBtn').onclick=()=>$('#importChanges').click();
$('#importChanges').onchange=async e=>{try{let packet=JSON.parse(await e.target.files[0].text()),r=importPacket(packet);toast(r.duplicate?'同じ更新パケットは取込済みです':`統合しました：場所${r.places}・情報源${r.signals}・理由${r.reasons}`)}catch(err){toast('取込エラー: '+err.message)}finally{e.target.value=''}};
$('#markSynced').onclick=()=>{if(!state.changes.length&&!state.sourceSignals.length&&!state.decisionReasons.length)return toast('未同期の変更はありません');state.syncedChanges.push({at:new Date().toISOString(),changes:state.changes,source_signals:state.sourceSignals,decision_reasons:state.decisionReasons});state.changes=[];state.sourceSignals=[];state.decisionReasons=[];save();renderMemory(DATA);renderSources();toast('現在の変更を同期済みにしました')};
$('#sourceSearch').oninput=renderSources;$('#sourceFilter').onchange=renderSources;
function fullBackup(){return {schema_version:'0.5.0-dev',exported_at:new Date().toISOString(),state,external_snapshot:{places:state.cache['places.json']||null,sources:state.cache['watch-sources.json']||null,preferences:state.cache['preference-profile.json']||null}}}
$('#exportBackup').onclick=()=>download('yorimichi-full-backup.json',fullBackup());
$('#importBackupBtn').onclick=()=>$('#importBackup').click();
$('#importBackup').onchange=async e=>{try{let b=JSON.parse(await e.target.files[0].text());if(!b.state||!Array.isArray(b.state.ledger))throw Error('バックアップ形式ではありません');if(!confirm('現在の端末内データを置き換えますか？'))return;state=b.state;save();location.reload()}catch(err){toast('復元エラー: '+err.message)}finally{e.target.value=''}};
function download(n,x){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$('#exportLedger').onclick=()=>download('yorimichi-places-updated.json',{schema_version:'0.2',exported_at:new Date().toISOString(),places:state.ledger});
$('#exportChanges').onclick=()=>download('yorimichi-change-packet.json',{schema_version:'0.4.0',exported_at:new Date().toISOString(),changes:state.changes,source_signals:state.sourceSignals||[],decision_reasons:state.decisionReasons||[],model_evaluation:state.ledger.filter(x=>x.outcome_snapshot).map(x=>({name:x.name,recommendation_snapshot:x.recommendation_snapshot||null,outcome_snapshot:x.outcome_snapshot,prediction_outcome_gap:x.prediction_outcome_gap||null}))});
loadMemory();
