</style></head><body><div class="app"><header class="hero"><div><div class="small">REAL-TIME DETOUR DECISION KIT</div><h1>よりみちOS</h1><p>外部記憶を読み、推薦への反応を場所台帳へ戻す循環型プロトタイプ。</p></div><div class="badge">v0.2.0</div></header>
<section class="card"><h2>外部記憶</h2><div class="stats"><div class="stat"><b id="allN">-</b>場所</div><div class="stat"><b id="wantN">-</b>行ってみたい</div><div class="stat"><b id="reN">-</b>再訪候補</div><div class="stat"><b id="srcN">-</b>情報源</div></div><div id="memoryStatus" class="status">読み込み中…</div><div class="actions"><button class="secondary" id="reloadMemory">再読込</button><button class="ghost" id="exportLedger">場所台帳を書き出す</button><button class="ghost" id="exportChanges">更新パケットを書き出す</button></div></section>
<div class="grid"><section class="card"><h2>1. いまの状況</h2><div class="row"><div class="field"><label>現在地</label><input id="currentPlace" placeholder="駅名・施設名"><button class="secondary" id="geoBtn" style="margin-top:6px">現在地を取得</button></div><div class="field"><label>現在時刻</label><input id="now" type="datetime-local"></div></div><div class="row"><div class="field"><label>次の目的地</label><input id="nextPlace" placeholder="なし"></div><div class="field"><label>到着期限</label><input id="deadline" type="datetime-local"></div></div><div class="row"><div class="field"><label>移動手段</label><select id="mode"><option>徒歩＋公共交通</option><option>徒歩のみ</option><option>自転車</option><option>車・タクシー</option></select></div><div class="field"><label>安全余裕</label><select id="buffer"><option value="10">10分</option><option value="15" selected>15分</option><option value="20">20分</option></select></div></div><div class="field"><label>気分・制約</label><textarea id="mood"></textarea></div><div class="chips"><label class="chip"><input type="checkbox" value="未知優先" checked>未知</label><label class="chip"><input type="checkbox" value="イベント優先" checked>イベント</label><label class="chip"><input type="checkbox" value="建築・運営" checked>建築・運営</label><label class="chip"><input type="checkbox" value="本・植物・音">本・植物・音</label></div><div class="actions"><button class="accent" id="makePrompt">調査依頼を作る</button></div></section>
<section class="card"><h2>2. M365 Copilotへ渡す</h2><textarea id="promptOut" style="min-height:350px"></textarea><div class="actions"><button class="green" id="copyPrompt">コピー</button></div><p class="small">現在地付近の行ってみたい・再訪候補と、外部記憶URLを含めます。</p></section></div>
<section class="card"><div class="tabs"><button class="tab active" data-tab="results">結果</button><button class="tab" data-tab="ledger">場所台帳</button><button class="tab" data-tab="history">履歴</button><button class="tab" data-tab="prefs">好み</button></div><div id="resultsTab"><textarea id="responseIn" placeholder="CopilotのJSON回答を貼る"></textarea><div class="actions"><button id="parseBtn">候補を読み込む</button></div><div id="resultList"></div></div><div id="ledgerTab" class="hidden"><div class="row"><input id="ledgerSearch" placeholder="場所名を検索"><select id="ledgerFilter"><option value="">すべて</option><option value="want_to_visit">行ってみたい</option><option value="visited_want_to_revisit">また行きたい</option><option value="visited">訪問済み</option><option value="suppressed">今後は勧めない</option></select></div><div id="ledgerList"></div></div><div id="historyTab" class="hidden"><div id="historyList"></div></div><div id="prefsTab" class="hidden"><textarea id="prefsText"></textarea></div></section></div>
<div id="reviewModal" class="modal hidden"><div class="sheet"><button class="ghost close" id="closeModal">閉じる</button><h2 id="reviewTitle">訪問レビュー</h2><div class="field"><label>予想との差</label><select id="expectation"><option>期待以上</option><option selected>ほぼ予想通り</option><option>期待以下</option></select></div><div class="field"><label>再訪意向</label><select id="revisit"><option>強くまた行きたい</option><option selected>条件次第</option><option>一度で十分</option></select></div><div class="field"><label>良かった要素</label><div class="chips" id="goodTags"></div></div><div class="field"><label>再訪条件・メモ</label><textarea id="reviewNote"></textarea></div><button class="green" id="saveReview">レビューを保存</button></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],KEY='yorimichi_os_v02';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{ledger:[],history:[],changes:[],prefs:null,cache:{}};let candidates=[],coords=null,reviewIndex=null;const DATA=['places.json','watch-sources.json','preference-profile.json'];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}function dt(d=new Date()){let z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}$('#now').value=dt();$('#deadline').value=dt(new Date(Date.now()+2*3600e3));
function key(p){return p.google_place_id||p.google_maps_place_url||p.google_maps_url||((p.name||'')+'|'+(p.address||'')).toLowerCase()}function mergeLedger(items){let m=new Map(state.ledger.map(x=>[key(x),x]));items.forEach(x=>{let k=key(x);m.set(k,{...x,...(m.get(k)||{})})});state.ledger=[...m.values()];save()}
async function loadMemory(){let ok=[];for(const f of DATA){try{let r=await fetch(f+'?v='+Date.now());if(!r.ok)throw Error(r.status);let x=await r.json();state.cache[f]=x;ok.push(f)}catch(e){if(state.cache[f])ok.push(f+'(キャッシュ)')}}let p=state.cache['places.json'];if(p?.places)mergeLedger(p.places);state.prefs=state.cache['preference-profile.json']||state.prefs;save();renderMemory(ok);renderLedger()}
function renderMemory(ok){let p=state.cache['places.json']?.meta?.counts||{},s=state.cache['watch-sources.json']?.meta?.counts||{};$('#allN').textContent=state.ledger.length||p.places_total||0;$('#wantN').textContent=state.ledger.filter(x=>x.relationship==='want_to_visit').length;$('#reN').textContent=state.ledger.filter(x=>x.relationship==='visited_want_to_revisit').length;$('#srcN').textContent=s.instagram_following||0;$('#memoryStatus').textContent=`${ok.length}/3データ読込｜ローカル変更 ${state.changes.length}件｜最終確認 ${new Date().toLocaleString()}`}
$('#reloadMemory').onclick=loadMemory;$('#geoBtn').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{coords={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),accuracy_m:Math.round(p.coords.accuracy)};$('#currentPlace').value=`現在地 (${coords.lat}, ${coords.lng})`;toast('現在地を取得しました')},e=>toast(e.code===1?'位置情報が拒否されています':'位置情報を取得できません')):toast('位置情報非対応');
function sit(){return{current_place:$('#currentPlace').value,coordinates:coords,now:$('#now').value,next_destination:$('#nextPlace').value,arrival_deadline:$('#deadline').value,travel_mode:$('#mode').value,buffer_minutes:+$('#buffer').value,mood:$('#mood').value,search_modes:$$('.chip input:checked').map(x=>x.value)}}function shortlist(){return state.ledger.filter(x=>['want_to_visit','visited_want_to_revisit'].includes(x.relationship)&&x.relationship!=='suppressed').slice(0,80).map(x=>({name:x.name,state:x.relationship,map:x.google_maps_url||x.google_maps_place_url||''}))}
$('#makePrompt').onclick=()=>{let s=sit(),urls={places:location.origin+location.pathname.replace(/[^/]*$/,'')+'places.json',sources:location.origin+location.pathname.replace(/[^/]*$/,'')+'watch-sources.json',preferences:location.origin+location.pathname.replace(/[^/]*$/,'')+'preference-profile.json'};$('#promptOut').value=`あなたは私専用のリアルタイム都市探索リサーチャーです。現在地・時間・次の予定を厳守し、公式情報と別系統情報で営業と当日イベントを確認してください。人気順ではなく、建築履歴、読み替え、更新可能性、複合用途、半公共性、制作・物流の可視化、非飲酒参加性で評価してください。\n\n【状況】\n${JSON.stringify(s,null,2)}\n\n【継続参照データ】\n${JSON.stringify(urls,null,2)}\n\n【ローカルの優先候補】\n${JSON.stringify(shortlist(),null,2)}\n\n【除外】\n${JSON.stringify(state.ledger.filter(x=>x.relationship==='suppressed').map(x=>x.name),null,2)}\n\n3〜7件に絞り、JSONのみ返してください。各候補に name,category,address,google_place_id,google_maps_place_url,official_url,arrival_time,depart_by,travel_minutes_from_current,travel_minutes_to_next,stay_minutes,open_at_arrival,event_today,why_fit,design_operations,non_alcohol,smoking,cost,operating_status,sources,confidence,taste_score,today_value_score,risk_notes を含めてください。`;toast('調査依頼を作りました')};
$('#copyPrompt').onclick=async()=>{let t=$('#promptOut').value;if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(t);else{$('#promptOut').select();document.execCommand('copy')}toast('コピーしました')};function extract(t){let a=t.indexOf('{'),b=t.lastIndexOf('}');return JSON.parse(t.slice(a,b+1))}function score(c){return Math.round((+c.taste_score||0)*.5+(+c.today_value_score||0)*.3+(+c.confidence||0)*20)}function mapUrl(c){if(c.google_maps_place_url)return c.google_maps_place_url;let q=[c.name,c.address].filter(Boolean).join(' ');return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
$('#parseBtn').onclick=()=>{try{candidates=extract($('#responseIn').value).candidates||[];candidates.sort((a,b)=>score(b)-score(a));renderResults()}catch(e){toast('JSONを読み込めません')}};function renderResults(){$('#resultList').innerHTML=candidates.map((c,i)=>`<div class="result"><div class="top"><div><b>${c.name||''}</b><div class="small">${c.category||''}｜${c.address||''}</div></div><div class="score">${score(c)}</div></div><p>${(c.why_fit||[]).join('。')}</p><span class="tag">滞在 ${c.stay_minutes||'?'}分</span><span class="tag">${c.operating_status||'不明'}</span><div class="actions"><a href="${mapUrl(c)}" target="_blank"><button class="green">店舗情報</button></a><button data-act="want" data-i="${i}">行ってみたい</button><button class="secondary" data-act="visit" data-i="${i}">行った</button><button class="secondary" data-act="revisit" data-i="${i}">また行きたい</button><button class="ghost" data-act="skip" data-i="${i}">今回は見送り</button><button class="danger" data-act="suppress" data-i="${i}">今後は勧めない</button></div></div>`).join('');$$('[data-act]').forEach(b=>b.onclick=()=>act(+b.dataset.i,b.dataset.act))}
function upsert(c,relationship,extra={}){let k=key(c),i=state.ledger.findIndex(x=>key(x)===k),p={...(i>=0?state.ledger[i]:{}),name:c.name,address:c.address||'',category:c.category||'',google_place_id:c.google_place_id||null,google_maps_place_url:c.google_maps_place_url||mapUrl(c),relationship,last_interaction_at:new Date().toISOString(),...extra};if(i>=0)state.ledger[i]=p;else state.ledger.push(p);state.changes.push({action:i>=0?'update':'add',at:new Date().toISOString(),place:p});state.history.push({name:c.name,action:relationship,at:new Date().toISOString()});save();renderMemory(DATA);renderLedger()}
function act(i,a){let c=candidates[i];if(a==='want'){upsert(c,'want_to_visit',{visit_status:'not_visited'});toast('行ってみたいへ追加')}if(a==='visit'){upsert(c,'visited',{visit_status:'visited'});openReview(i)}if(a==='revisit'){upsert(c,'visited_want_to_revisit',{visit_status:'visited',revisit_interest:'high'});toast('また行きたいへ追加')}if(a==='skip'){state.history.push({name:c.name,action:'skipped_this_time',at:new Date().toISOString()});state.changes.push({action:'interaction',at:new Date().toISOString(),name:c.name,state:'skipped_this_time'});save();toast('今回の見送りを記録')}if(a==='suppress'){upsert(c,'suppressed',{recommendation_suppressed:true});toast('今後は勧めないへ追加')}}
const tags=['建築履歴','設計操作','本','植物','家具','音','飲食','ノンアル','人との距離','滞在性','制作・物流'];$('#goodTags').innerHTML=tags.map(t=>`<label class="chip"><input type="checkbox" value="${t}">${t}</label>`).join('');function openReview(i){reviewIndex=i;$('#reviewTitle').textContent=candidates[i].name+' のレビュー';$('#reviewModal').classList.remove('hidden')}$('#closeModal').onclick=()=>$('#reviewModal').classList.add('hidden');$('#saveReview').onclick=()=>{let c=candidates[reviewIndex],rev=$('#revisit').value,rel=rev==='強くまた行きたい'?'visited_want_to_revisit':'visited';upsert(c,rel,{visit_status:'visited',expectation:$('#expectation').value,revisit_intent:rev,positive_tags:$$('#goodTags input:checked').map(x=>x.value),review_note:$('#reviewNote').value});$('#reviewModal').classList.add('hidden');toast('レビューを保存')};
function renderLedger(){let q=($('#ledgerSearch')?.value||'').toLowerCase(),f=$('#ledgerFilter')?.value||'',xs=state.ledger.filter(x=>(!q||(x.name||'').toLowerCase().includes(q))&&(!f||x.relationship===f)).slice(0,300);$('#ledgerList').innerHTML=`<p class="small">${xs.length}件表示（最大300件）</p>`+xs.map(x=>`<div class="listrow"><div><b>${x.name}</b><div class="small">${x.category||''}｜${x.source_list||'よりみちOS'}</div></div><span class="tag">${x.relationship||''}</span></div>`).join('')}$('#ledgerSearch').oninput=renderLedger;$('#ledgerFilter').onchange=renderLedger;function renderHistory(){$('#historyList').innerHTML=[...state.history].reverse().slice(0,300).map(x=>`<div class="listrow"><div><b>${x.name}</b><div class="small">${new Date(x.at).toLocaleString()}</div></div><span class="tag">${x.action}</span></div>`).join('')}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['results','ledger','history','prefs'].forEach(x=>$('#'+x+'Tab').classList.toggle('hidden',x!==b.dataset.tab));if(b.dataset.tab==='history')renderHistory();if(b.dataset.tab==='prefs')$('#prefsText').value=JSON.stringify(state.prefs,null,2)});function download(n,x){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}$('#exportLedger').onclick=()=>download('yorimichi-places-updated.json',{schema_version:'0.2',exported_at:new Date().toISOString(),places:state.ledger});$('#exportChanges').onclick=()=>download('yorimichi-change-packet.json',{schema_version:'0.2',exported_at:new Date().toISOString(),changes:state.changes});loadMemory();
</script>
